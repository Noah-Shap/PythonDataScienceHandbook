[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argmine-corpus"
version = "0.1.0"
description = "Idempotent pipeline that assembles a verified, tiered, annotated bibliography and full-text corpus of the argumentation mining / computational argumentation field, prepared for RAG ingestion."
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "requests-cache==1.3.3",
    "rapidfuzz==3.14.6",
    "pymupdf==1.28.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
index = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["argmine*"]
